[project]
name = "modernizer-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["rich>=13.7", "claude-agent-sdk", "pytest", "pytest-playwright"]

[project.scripts]
agent = "modernizer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["modernizer*"]

[tool.setuptools.package-data]
modernizer = ["../skills/*.md"]
